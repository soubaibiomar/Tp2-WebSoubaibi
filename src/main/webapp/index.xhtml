
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<h:head>
    <title>TP2 - Assistant IA</title>
    <h:outputStylesheet
            library="css"
            name="mycsslayout.css"/>
</h:head>

<h:body>
    <main class="application">

        <header class="entete">
            <h1>Assistant IA</h1>
            <p>TP2 - JSF, LangChain4j et Gemini</p>
        </header>

        <h:form id="formChat">

            <p:messages
                    id="messages"
                    closable="true"/>

            <section class="barre-outils">

                <div class="selection-role">
                    <h:outputLabel
                            for="role"
                            value="Rôle système"/>

                    <p:selectOneMenu
                            id="role"
                            value="#{bb.roleSysteme}">

                        <f:selectItem
                                itemLabel="Assistant"
                                itemValue="assistant"/>

                        <f:selectItem
                                itemLabel="Traducteur"
                                itemValue="traducteur"/>

                        <f:selectItem
                                itemLabel="Coach de débat scientifique"
                                itemValue="coach"/>

                        <p:ajax
                                event="change"
                                process="@this"
                                listener="#{bb.changerRole}"
                                update="@form"/>
                    </p:selectOneMenu>
                </div>

                <p:commandButton
                        value="Nouvelle conversation"
                        icon="pi pi-refresh"
                        action="#{bb.nouvelleConversation}"
                        process="@this"
                        update="@form"
                        styleClass="bouton-secondaire"/>
            </section>

            <h:panelGroup
                    id="conversation"
                    layout="block"
                    styleClass="conversation">

                <ui:repeat
                        value="#{bb.conversation}"
                        var="message">

                    <div class="#{message.utilisateur
                            ? 'message-utilisateur'
                            : 'message-assistant'}">

                        <div class="auteur">
                            <h:outputText
                                    value="#{message.auteur}"/>
                        </div>

                        <h:outputText
                                value="#{message.texte}"
                                styleClass="texte-message"/>
                    </div>

                </ui:repeat>

                <h:panelGroup
                        rendered="#{empty bb.conversation}">

                    <div class="message-assistant">
                        <strong>Assistant</strong>
                        <p>
                            Bonjour ! Comment puis-je vous aider ?
                        </p>
                    </div>

                </h:panelGroup>

            </h:panelGroup>

            <section class="zone-saisie">

                <p:inputTextarea
                        id="question"
                        value="#{bb.question}"
                        rows="3"
                        autoResize="false"
                        placeholder="Écrivez votre question..."
                        styleClass="champ-question"/>

                <p:commandButton
                        id="envoyer"
                        value="Envoyer"
                        icon="pi pi-send"
                        action="#{bb.envoyer}"
                        process="@form"
                        update="@form"
                        oncomplete="defilerConversation();"
                        styleClass="bouton-envoyer"/>
            </section>

        </h:form>
    </main>

    <h:outputScript
            library="js"
            name="script.js"
            target="body"/>
</h:body>
</html>
